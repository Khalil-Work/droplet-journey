<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-label="Droplet Journey banner">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1d33"/>
      <stop offset="1" stop-color="#081221"/>
    </linearGradient>
    <linearGradient id="drop" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4fc3f7"/>
      <stop offset="1" stop-color="#0277bd"/>
    </linearGradient>
    <marker id="tarrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#e8b04b"/>
    </marker>
  </defs>
  <rect width="1200" height="300" fill="url(#bg)"/>
  <!-- d2-law shrink sequence: D ~ sqrt(D0^2 - K t) -->
  <g transform="translate(80,50)">
    <!-- time axis -->
    <line x1="10" y1="200" x2="470" y2="200" stroke="#5b7a99" stroke-width="2" marker-end="url(#tarrow)"/>
    <text x="240" y="235" fill="#5b7a99" font-family="Segoe UI, Arial, sans-serif" font-size="17">time t</text>
    <!-- droplet 1: large, warm -->
    <ellipse cx="80" cy="120" rx="46" ry="56" fill="url(#drop)" stroke="#b3e5fc" stroke-width="2"/>
    <path d="M 66 100 q 10 -6 16 2" stroke="#ffffff" stroke-width="3" fill="none" opacity="0.7"/>
    <text x="52" y="205" fill="#9fb8ce" font-family="Consolas, monospace" font-size="15">D₀, T_d ↑</text>
    <!-- droplet 2: smaller, vapor wisps -->
    <ellipse cx="230" cy="145" rx="33" ry="40" fill="url(#drop)" stroke="#b3e5fc" stroke-width="2"/>
    <path d="M 258 120 q 12 -10 24 -2" stroke="#7fd1f0" stroke-width="3" fill="none" opacity="0.55"/>
    <path d="M 262 138 q 14 -8 26 0" stroke="#7fd1f0" stroke-width="3" fill="none" opacity="0.4"/>
    <!-- droplet 3: smallest -->
    <ellipse cx="360" cy="165" rx="20" ry="25" fill="url(#drop)" stroke="#b3e5fc" stroke-width="2"/>
    <path d="M 384 152 q 12 -10 22 -3" stroke="#7fd1f0" stroke-width="3" fill="none" opacity="0.5"/>
    <!-- d2 law bracket -->
    <path d="M 62 42 Q 210 8 352 138" stroke="#e8b04b" stroke-width="2.5" fill="none" stroke-dasharray="7 5"/>
    <text x="150" y="30" fill="#e8b04b" font-family="Consolas, monospace" font-size="17">D²(t) = D₀² − K t</text>
  </g>
  <!-- wordmark -->
  <g font-family="Segoe UI, Arial, sans-serif">
    <text x="580" y="130" fill="#ffffff" font-size="62" font-weight="800" letter-spacing="1">Droplet <tspan fill="#4fc3f7">Journey</tspan></text>
    <text x="582" y="175" fill="#9fb8ce" font-size="22">evaporation · heating · drag — a 0-D single-droplet model</text>
    <text x="582" y="215" fill="#5b7a99" font-family="Consolas, monospace" font-size="16">Spalding B_M · d² law · Clapeyron · Schiller-Naumann</text>
  </g>
</svg>
